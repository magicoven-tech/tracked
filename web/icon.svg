<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg-grad)" />
  <!-- Robot Face Outline -->
  <rect x="36" y="56" width="120" height="80" rx="24" fill="none" stroke="url(#glow-grad)" stroke-width="6" filter="url(#glow)" />
  <!-- Left Eye -->
  <circle cx="68" cy="96" r="14" fill="none" stroke="url(#glow-grad)" stroke-width="5" filter="url(#glow)" />
  <circle cx="68" cy="96" r="6" fill="url(#glow-grad)" filter="url(#glow)" />
  <!-- Right Eye -->
  <circle cx="124" cy="96" r="14" fill="none" stroke="url(#glow-grad)" stroke-width="5" filter="url(#glow)" />
  <circle cx="124" cy="96" r="6" fill="url(#glow-grad)" filter="url(#glow)" />
  <!-- Smile -->
  <path d="M 84 116 Q 96 124 108 116" fill="none" stroke="url(#glow-grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
</svg>
